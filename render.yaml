services:
  - type: web
    name: predictive-cybercrime-analysis
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r backend/requirements.txt && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: cybercrime-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/cybercrime.db
